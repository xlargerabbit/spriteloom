[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spriteloom-mcp"
version = "0.2.0"
description = "Local MCP tools for Spriteloom sprite generation"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "websockets>=12,<17",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
spriteloom-mcp = "spriteloom_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spriteloom_mcp*"]
